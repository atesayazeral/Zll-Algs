<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zll Algs/Your Cube Trainer!</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-soft: #162032;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --yellow: #eab308;
            --green: #22c55e;
            --orange: #f97316;
            --border: #283548;
        }

        html.light-mode {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --bg-soft: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 50px;
        }

        header {
            padding: 1.5rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .site-title {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .nav-tabs {
            display: flex;
            gap: 0.4rem;
            background: var(--bg-card);
            padding: 0.35rem;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1.3rem;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
        }

        .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0.5rem auto;
            padding: 0 1.5rem;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .filter-btn.active {
            border-color: var(--accent);
            color: white;
            background: rgba(59, 130, 246, 0.2);
        }

        .alg-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }

        .alg-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1.5rem;
            padding: 1.1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .alg-card.learned { border-color: rgba(34, 197, 94, 0.5); }
        .alg-card.learning { border-color: rgba(249, 115, 22, 0.5); }

        .cube-viz {
            width: 78px;
            height: 78px;
            flex-shrink: 0;
        }

        .alg-info {
            flex: 1;
            min-width: 0;
        }

        .alg-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
        }

        .alg-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .status-pill {
            background: var(--bg-dark);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.2rem 0.65rem;
            border-radius: 999px;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
        }

        .alg-card.learned .status-pill { color: var(--green); border-color: rgba(34, 197, 94, 0.4); }
        .alg-card.learning .status-pill { color: var(--orange); border-color: rgba(249, 115, 22, 0.4); }

        .alg-notation {
            font-family: 'Consolas', monospace;
            font-size: 0.92rem;
            color: var(--yellow);
            background: var(--bg-dark);
            padding: 0.55rem 0.85rem;
            border-radius: 1rem;
            word-break: break-word;
        }

        .trainer-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 2rem;
            padding: 2.5rem 1.5rem;
            text-align: center;
            max-width: 600px;
            margin: 1rem auto;
        }

        .trainer-top {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        select.pill-select {
            background: var(--bg-dark);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem 1.2rem;
            border-radius: 999px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .btn-pill {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-ghost {
            background: var(--bg-dark);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 0.6rem 1.4rem;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .trainer-viz {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
        }

        .scramble-display {
            font-family: 'Arial', monospace;
            font-size: 1.2rem;
            color: var(--text-muted);
            background: var(--bg-dark);
            padding: 0.9rem 1.2rem;
            border-radius: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .timer-display {
            font-family: 'Arial', monospace;
            font-size: 3.8rem;
            font-weight: 700;
            margin: 0.5rem 0 1.5rem 0;
            user-select: none;
            cursor: pointer;
        }

        .timer-running { color: var(--green); }
        .timer-ready { color: var(--green); }

        .solution-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--bg-dark);
            border-radius: 1.25rem;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="site-title">Zll Algs</div>
    <div class="header-right">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('oll', this)">OLL</button>
            <button class="tab-btn" onclick="switchTab('pll', this)">PLL</button>
            <button class="tab-btn" onclick="switchTab('trainer', this)">Trainer</button>
        </div>
        <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">☀️</button>
    </div>
</header>

<div class="container">
    <!-- LIBRARY -->
    <div id="library-view">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="setFilter('all', this)">Tümü</button>
            <button class="filter-btn" onclick="setFilter('unlearned', this)">Öğrenilmedi</button>
            <button class="filter-btn" onclick="setFilter('learning', this)">Çalışılıyor</button>
            <button class="filter-btn" onclick="setFilter('learned', this)">Öğrenildi</button>
        </div>
        <div class="alg-grid" id="alg-grid"></div>
    </div>

    <!-- TRAINER -->
    <div id="trainer-view" class="hidden">
        <div class="trainer-box">
            <div class="trainer-top">
                <select id="trainer-category" class="pill-select" onchange="nextCase()">
                    <option value="all">OLL + PLL</option>
                    <option value="oll">Sadece OLL</option>
                    <option value="pll">Sadece PLL</option>
                    <option value="learning">Çalışılanlar</option>
                </select>
                <button class="btn-pill" onclick="nextCase()">Sonraki (N)</button>
            </div>

            <div class="trainer-viz" id="trainer-cube"></div>
            <div class="scramble-display" id="trainer-scramble"></div>

            <div class="timer-display" id="timer">0.00</div>

            <button class="btn-ghost" id="reveal-btn" onclick="revealSolution()">Algoritmayı Göster</button>

            <div class="solution-box hidden" id="solution-box">
                <div id="sol-name" style="font-weight: 700; margin-bottom: 0.4rem;"></div>
                <div id="sol-alg" style="font-family: Consolas, monospace; color: var(--yellow); font-size: 1.15rem;"></div>
            </div>
        </div>
    </div>
</div>

    document.documentElement.classList.add('light-mode');
    document.getElementById('theme-toggle').innerText = '🌙';
}

    const isLight = document.documentElement.classList.toggle('light-mode');
    localStorage.setItem('zll_theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-toggle').innerText = isLight ? '🌙' : '☀️';

    { id: 'oll-35', type: 'oll', name: 'OLL 35', alg: "R U2 R2 F R F' R U2 R'", setup: "R U2 R' F R' F' R2 U2 R'", pattern: "100011011011000000110" },
    { id: 'oll-36', type: 'oll', name: 'OLL 36', alg: "L' U' L U' L' U L U L F' L' F", setup: "F' L F L' U' L' U' L U L' U L", pattern: "100110011011000000110" },

    { id: 'oll-38', type: 'oll', name: 'OLL 38', alg: "R U R' U R U' R' U' R' F R F'", setup: "F R' F' R U R U R' U' R U' R'", pattern: "001011110110000000011" },
    { id: 'oll-39', type: 'oll', name: 'OLL 39', alg: "L F' L' U' L U F U' L'", setup: "L U F' U' L' U L F L'", pattern: "001111100110000011000" },
    { id: 'oll-40', type: 'oll', name: 'OLL 40', alg: "R' F R U R' U' F' U R", setup: "R' U' F U R U' R' F' R", pattern: "100111001011000110000" },
    { id: 'oll-41', type: 'oll', name: 'OLL 41', alg: "R U R' U R U2 R' F R U R' U' F'", setup: "F U R U' R' F' R U2 R' U' R U' R'", pattern: "101010010010010000111" },
    { id: 'oll-42', type: 'oll', name: 'OLL 42', alg: "R' U' R U' R' U2 R F R U R' U' F'", setup: "F U R U' R' F' R' U2 R U R' U R", pattern: "010010101111010000010" },
    { id: 'oll-43', type: 'oll', name: 'OLL 43', alg: "F' U' L' U L F", setup: "F' L' U' L U F", pattern: "011011011000000010111" },
    { id: 'oll-44', type: 'oll', name: 'OLL 44', alg: "F U R U' R' F'", setup: "F R U R' U' F'", pattern: "110110110000111010000" },
    { id: 'oll-45', type: 'oll', name: 'OLL 45', alg: "F R U R' U' F'", setup: "F U R U' R' F'", pattern: "011111011000000000111" },
    { id: 'oll-46', type: 'oll', name: 'OLL 46', alg: "R' U' R' F R F' U R", setup: "R' U' F R' F' R U R", pattern: "111101111000010000000" },
    { id: 'oll-47', type: 'oll', name: 'OLL 47', alg: "R' U' R' F R F' R' F R F' U R", setup: "R' U' F R' F' R F R' F' R U R", pattern: "000011010110000111110" },
    { id: 'oll-48', type: 'oll', name: 'OLL 48', alg: "F R U R' U' R U R' U' F'", setup: "F U R U' R' U R U' R' F'", pattern: "000110010011111010010" },
    { id: 'oll-49', type: 'oll', name: 'OLL 49', alg: "r U' r2 U r2 U r2 U' r", setup: "r' U r2 U' r2 U' r2 U r'", pattern: "000011010010000111111" },
    { id: 'oll-50', type: 'oll', name: 'OLL 50', alg: "r' U r2 U' r2 U' r2 U r'", setup: "r U' r2 U r2 U r2 U' r", pattern: "010011000010000111111" },
    { id: 'oll-51', type: 'oll', name: 'OLL 51', alg: "F U R U' R' U R U' R' F'", setup: "F R U R' U' R U R' U' F'", pattern: "000111000010001010101" },
    { id: 'oll-52', type: 'oll', name: 'OLL 52', alg: "R U R' U R U' B U' B' R'", setup: "R B U B' U R' U' R U' R'", pattern: "010010010001000101111" },
    { id: 'oll-53', type: 'oll', name: 'OLL 53', alg: "l' U2 L U L' U' L U L' U l", setup: "l' U' L U' L' U L U' L' U2 l", pattern: "000011010111000011110" },
    { id: 'oll-54', type: 'oll', name: 'OLL 54', alg: "r U2 R' U' R U R' U' R U' r'", setup: "r U R' U R U' R' U R U2 r'", pattern: "000110010111011010010" },
    { id: 'oll-55', type: 'oll', name: 'OLL 55', alg: "R' F R U R U' R2 F' R2 U' R' U R U R'", setup: "R U' R' U' R U R2 F R2 U R' U' R' F' R", pattern: "010010010000111000111" },
    { id: 'oll-56', type: 'oll', name: 'OLL 56', alg: "r' U' r U' R' U R U' R' U R r' U r", setup: "r' U' r R' U' R U R' U' R U r' U r", pattern: "000111000111000111000" },
    { id: 'oll-57', type: 'oll', name: 'OLL 57', alg: "R U R' U' M' U R U' r'", setup: "r U R' U' M U R U' R'", pattern: "101111101010000010000" }
];

let currentTab = 'oll';
let currentFilter = 'all';
let userProgress = {};

try {
    userProgress = JSON.parse(localStorage.getItem('zll_algs_progress')) || {};
} catch (e) {
    userProgress = {};
}

let currentTrainerAlg = null;
let timerInterval = null;
let startTime = 0;
let isRunning = false;
let isReady = false;

function renderCubeSVG(algObj) {
    const p = algObj.pattern;
    const isLight = document.documentElement.classList.contains('light-mode');
    const yellow = '#eab308';
    const gray = isLight ? '#cbd5e1' : '#283548';
    const bg = isLight ? '#f8fafc' : '#0f172a';
    const arrowColor = isLight ? '#0f172a' : '#0f172a';
    
    let svg = `<svg viewBox="0 0 110 110" width="100%" height="100%">
        <rect x="0" y="0" width="110" height="110" rx="20" fill="${bg}"/>`;

    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
            const idx = r * 3 + c;
            const color = p[idx] === '1' ? yellow : gray;
            svg += `<rect x="${17 + c * 26}" y="${17 + r * 26}" width="24" height="24" rx="6" fill="${color}"/>`;
        }
    }

    for (let i = 0; i < 3; i++) {
        svg += `<rect x="${17 + i * 26}" y="7" width="24" height="7" rx="3.5" fill="${p[9 + i] === '1' ? yellow : gray}"/>`;
    }
    for (let i = 0; i < 3; i++) {
        svg += `<rect x="96" y="${17 + i * 26}" width="7" height="24" rx="3.5" fill="${p[12 + i] === '1' ? yellow : gray}"/>`;
    }
    for (let i = 0; i < 3; i++) {
        svg += `<rect x="${17 + i * 26}" y="96" width="24" height="7" rx="3.5" fill="${p[15 + i] === '1' ? yellow : gray}"/>`;
    }
    for (let i = 0; i < 3; i++) {
        svg += `<rect x="7" y="${17 + i * 26}" width="7" height="24" rx="3.5" fill="${p[18 + i] === '1' ? yellow : gray}"/>`;
    }

    if (algObj.arrows) {
        svg += `<defs><marker id="arr-${algObj.id}" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
            <polygon points="0 0, 6 3, 0 6" fill="${arrowColor}" />
        </marker></defs>`;
        
        const centers = [
            [29, 29], [55, 29], [81, 29],
            [29, 55], [55, 55], [81, 55],
            [29, 81], [55, 81], [81, 81]
        ];

        algObj.arrows.forEach(([from, to]) => {
            const [x1, y1] = centers[from];
            const [x2, y2] = centers[to];
            svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${arrowColor}" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr-${algObj.id})" />`;
        });
    }

    svg += `</svg>`;
    return svg;
}

function switchTab(tab, btnElement) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) btnElement.classList.add('active');

    if (tab === 'trainer') {
        document.getElementById('library-view').classList.add('hidden');
        document.getElementById('trainer-view').classList.remove('hidden');
        if (!currentTrainerAlg) nextCase();
    } else {
        document.getElementById('trainer-view').classList.add('hidden');
        document.getElementById('library-view').classList.remove('hidden');
        renderGrid();
    }
}

function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    renderGrid();
}

function updateStatus(id, status) {
    userProgress[id] = status;
    try {
        localStorage.setItem('zll_algs_progress', JSON.stringify(userProgress));
    } catch (e) {}
    renderGrid();
}

function renderGrid() {
    const grid = document.getElementById('alg-grid');
    grid.innerHTML = '';

    const typeAlgs = ALGORITHMS.filter(a => a.type === currentTab);
    const filtered = typeAlgs.filter(a => {
        const st = userProgress[a.id] || 'unlearned';
        return currentFilter === 'all' || st === currentFilter;
    });

    filtered.forEach(alg => {
        const status = userProgress[alg.id] || 'unlearned';
        const card = document.createElement('div');
        card.className = `alg-card ${status}`;
        card.innerHTML = `
            <div class="cube-viz">${renderCubeSVG(alg)}</div>
            <div class="alg-info">
                <div class="alg-top">
                    <span class="alg-name">${alg.name}</span>
                    <select class="status-pill" onchange="updateStatus('${alg.id}', this.value)">
                        <option value="unlearned" ${status === 'unlearned' ? 'selected' : ''}>Öğrenilmedi</option>
                        <option value="learning" ${status === 'learning' ? 'selected' : ''}>Çalışılıyor</option>
                        <option value="learned" ${status === 'learned' ? 'selected' : ''}>Öğrenildi</option>
                    </select>
                </div>
                <div class="alg-notation">${alg.alg}</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function nextCase() {
    const cat = document.getElementById('trainer-category').value;
    let pool = ALGORITHMS;

    if (cat === 'oll') pool = ALGORITHMS.filter(a => a.type === 'oll');
    else if (cat === 'pll') pool = ALGORITHMS.filter(a => a.type === 'pll');
    else if (cat === 'learning') {
        pool = ALGORITHMS.filter(a => userProgress[a.id] === 'learning');
        if (pool.length === 0) {
            alert('Henüz "Çalışılıyor" olarak işaretlenmiş algoritman yok.');
            pool = ALGORITHMS;
        }
    }

    currentTrainerAlg = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('trainer-cube').innerHTML = renderCubeSVG(currentTrainerAlg);
    document.getElementById('trainer-scramble').innerText = currentTrainerAlg.setup;
    
    document.getElementById('solution-box').classList.add('hidden');
    document.getElementById('reveal-btn').classList.remove('hidden');
    
    resetTimer();
}

function revealSolution() {
    if (!currentTrainerAlg) return;
    document.getElementById('sol-name').innerText = currentTrainerAlg.name;
    document.getElementById('sol-alg').innerText = currentTrainerAlg.alg;
    document.getElementById('solution-box').classList.remove('hidden');
    document.getElementById('reveal-btn').classList.add('hidden');
}

function resetTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    const tEl = document.getElementById('timer');
    tEl.innerText = '0.00';
    tEl.className = 'timer-display';
}

function startTimer() {
    isRunning = true;
    startTime = Date.now();
    const tEl = document.getElementById('timer');
    tEl.className = 'timer-display timer-running';
    timerInterval = setInterval(() => {
        const elapsed = (Date.now() - startTime) / 1000;
        tEl.innerText = elapsed.toFixed(2);
    }, 10);
}

function stopTimer() {
    clearInterval(timerInterval);
    isRunning = false;
    document.getElementById('timer').className = 'timer-display';
    revealSolution();
}

document.addEventListener('keydown', (e) => {
    if (currentTab !== 'trainer') return;
    if (e.code === 'Space') {
        e.preventDefault();
        if (isRunning) {
            stopTimer();
        } else if (!isReady) {
            isReady = true;
            document.getElementById('timer').classList.add('timer-ready');
        }
    } else if (e.key.toLowerCase() === 'n' && !isRunning) {
        nextCase();
    }
});

document.addEventListener('keyup', (e) => {
    if (currentTab !== 'trainer') return;
    if (e.code === 'Space') {
        if (isReady) {
            isReady = false;
            startTimer();
        }
    }
});

document.getElementById('timer').addEventListener('click', () => {
    if (isRunning) stopTimer();
    else startTimer();
});

renderGrid();
</script>
